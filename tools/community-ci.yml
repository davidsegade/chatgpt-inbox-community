name: Validate community plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run package:community -- /tmp/community-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: community-candidate
          path: /tmp/community-candidate/release-assets/
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:local-ci-test-only@127.0.0.1:5432/chatgpt_inbox_test_ci
      TEST_DATABASE_URL: postgresql://relay_test_ci:relay-ci-test-only@127.0.0.1:5432/chatgpt_inbox_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tools/prepare-postgres-test.mjs
      - run: npm run test:postgres
